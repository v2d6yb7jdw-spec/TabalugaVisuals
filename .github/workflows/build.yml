name: Build TabalugaVisuals

on:

  workflow_dispatch:

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4

        with:

          distribution: temurin

          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

        with:

          gradle-version: 8.10.2

      - name: Unpack project

        run: unzip -o TabalugaVisuals.zip

      - name: Build mod

        working-directory: TabalugaVisuals

        run: gradle build

      - name: Upload JAR

        uses: actions/upload-artifact@v4

        with:

          name: TabalugaVisuals-0.1

          path: TabalugaVisuals/build/libs/*.jar
